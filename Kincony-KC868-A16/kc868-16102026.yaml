sensor:
- platform: adc
  name: "KC868-An1"
  id: batvolt
  pin: GPIO36
  accuracy_decimals: 2
  update_interval: 5s
  unit_of_measurement: "V"
  icon: mdi:battery-medium
  filters:
    - multiply: 3.55
    - calibrate_linear: 
        - 3.11 -> 14.00
        - 3.00 -> 13.50
        - 2.89 -> 13.00
        - 2.77 -> 12.50
        - 2.67 -> 12.00
        - 2.55 -> 11.50
        - 2.45 -> 11.00
        - 2.34 -> 10.50
        - 2.22 -> 10.00
        - 2.11 -> 09.50
        - 2.00 -> 09.00
  on_value:
    then:
      - component.update: batpercent

- platform: template
  name: "Battery %"
  id: batpercent
  lambda: return id(batvolt).state;
  accuracy_decimals: 0
  unit_of_measurement: "%"
  icon: mdi:battery-medium
  filters:
    - calibrate_linear:
        method: exact
        datapoints:
        - 0.00 -> 0.0
        - 3.30 -> 1.0
        - 3.39 -> 10.0
        - 3.75 -> 50.0
        - 4.11 -> 90.0
        - 4.20 -> 100.0
    - lambda: |-
        if (x <= 100) {
          return x;
        } else {
          return 100;
        }
        if (x <0) {
          return 0;
        }
