# Irrigation Unlimited
irrigation_unlimited:
  controllers:
    zones:
      - entity_id: "switch.garden_relay_l1"
      - entity_id: "switch.garden_relay_l2"
      - entity_id: "switch.garden_relay_l3"
      - entity_id: "switch.garden_relay_l4"
    sequences:
      - name: "Summer"
        duration: "00:90"
        delay: "00:01"
        schedules:
          - time: "17:00"
            weekday: [tue, thu, sat]
            month: [nov, dec, jan, feb, mar]
        zones:
          - zone_id: 1
          - zone_id: 2
          - zone_id: 3
          - zone_id: 4
      - name: "Spring and Autumn"
        duration: "00:90"
        delay: "00:01"
        schedules:
          - time: "17:00"
            weekday: [sat, wed]
            month: [apr, may, sep, oct]
        zones:
          - zone_id: 1
          - zone_id: 2
          - zone_id: 3
          - zone_id: 4
